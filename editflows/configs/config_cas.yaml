optim:
  weight_decay: 0.03
  optimizer: AdamW
  lr: 1e-5
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  grad_clip: 1.
  eta_min_ratio: 0.1
  fused: false
  n_epochs: 500

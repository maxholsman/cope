defaults:
  - _self_

task: selfies

compute:
  ngpus: 1 
  nodes: 4

logging:
  log_freq: 10 
  log_lr_every: ${logging.log_freq}
  log_file_name: stdout.log
  run_name: selfies_bs64
  enable_wandb: True  
  entity: maximilianholsman
  project: Gated proposal model
  group: null

data:
  train_path: /usr/xtmp/mth45/Documents/programmable_biology_group/cope/data/28k_mimetics/train
  val_path: /usr/xtmp/mth45/Documents/programmable_biology_group/cope/data/28k_mimetics/validation
  cache_dir: null 
  num_workers: 2 

training:
  batch_size: None 
  snapshot: 100  
  eval_freq: 1000 
  perplexity_freq: 100  
  seed: 42
  grad_accumulation_steps: 1
  loc_prop_path: True
  lam_prop: 1
  # ckpt_path: /usr/xtmp/mth45/Documents/programmable_biology_group/cope/EditFlows/flow_matching/editflows/outputs/lr5e-4_epoch100_scale1.5_optimal0_p2p_cas9_esm2_tokenized_loc_prop/checkpoint/last.ckpt

eval:
  batch_size: None
  sample_batch_size: 4
  perplexity: False  
  perplexity_batch_size: 4
  lm_name: 

optim:
  weight_decay: 0.03
  optimizer: AdamW
  lr: 5e-5
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  grad_clip: 1.
  eta_min_ratio: 0.1
  fused: false
  n_epochs: 100
  warmup_ratio: 0.1

flow:
  source_distribution: uniform  
  loss_function: editflows  
  exponent: 2.
  scheduler_type: polynomial
  sampling_steps: 256  
  eps_id: -1  

model:
  d_model: 1020  
  # cond_dim: 256  # Remove this if not needed, or keep for future use
  max_len: 2048  # Change from 'length' to 'max_len'
  n_layers: 8   # Change from 'n_blocks' to 'n_layers'
  n_heads: 12
  dropout: 0.1   # This is read but not used - consider removing or using attn_dropout/proj_dropout instead
  attn_dropout: 0.1  # Add this if you want attention dropout
  proj_dropout: 0.1  # Add this if you want projection dropout
  compile: False  # Keep for future use or remove
  esm_model_name: facebook/esm2_t33_650M_UR50D
  freeze_esm: true
  p_optimal: 0
  scale_size: 1.5

work_dir: /usr/xtmp/mth45/Documents/programmable_biology_group/cope/EditFlows/flow_matching/editflows/outputs
